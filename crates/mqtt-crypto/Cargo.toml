[package]
name = "mqtt-crypto"
version = "1.6.0"
edition = "2024"
authors = ["Faez Barghasa <faez.barghasa.org@gmail.com>"]
description = "Hardware cryptography offload and TLS abstraction traits for MQTT embedded and host systems."
license = "MIT OR Apache-2.0"
repository = "https://github.com/FaezBarghasa/mqtt-async-embedded"
documentation = "https://docs.rs/mqtt-crypto"
readme = "README.md"
keywords = ["mqtt", "crypto", "tls", "no_std", "embedded"]
categories = ["embedded", "no-std", "cryptography"]

[dependencies]
defmt = { version = "1.0", optional = true }

[features]
default = []
defmt = ["dep:defmt"]
std = []
