[package]
name = "mqtt-storage"
version = "1.6.0"
edition = "2024"
authors = ["Faez Barghasa <faez.barghasa.org@gmail.com>"]
description = "Session state persistence and offline queuing abstractions for MQTT embedded and host runtimes."
license = "MIT OR Apache-2.0"
repository = "https://github.com/FaezBarghasa/mqtt-async-embedded"
documentation = "https://docs.rs/mqtt-storage"
readme = "README.md"
keywords = ["mqtt", "storage", "persistence", "no_std", "embedded"]
categories = ["embedded", "no-std", "database"]

[dependencies]
heapless = "0.9"
defmt = { version = "1.0", optional = true }

[features]
default = []
defmt = ["dep:defmt", "heapless/defmt"]
std = []
