name: CI

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Format Check
        run: cargo fmt --all -- --check

      - name: Clippy Workspace
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    name: Test Host (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Test Workspace (All Features)
        run: cargo test --workspace --all-features

      - name: Check Examples
        run: cargo check --workspace --all-features --examples

      - name: Check Documentation
        run: cargo doc --workspace --all-features --no-deps

  embedded:
    name: Embedded no_std (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - riscv32imc-unknown-none-elf   # ESP32-C2 / ESP32-C3
          - riscv32imac-unknown-none-elf  # ESP32-C6 / ESP32-H2
          - thumbv7em-none-eabihf         # ARM Cortex-M4F / Cortex-M7
          - thumbv6m-none-eabi           # ARM Cortex-M0 / Cortex-M0+
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain with embedded target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Pure no_std Build (mqtt-packet & mqtt-embedded)
        run: |
          cargo check --package mqtt-packet --target ${{ matrix.target }} --no-default-features
          cargo check --package mqtt-embedded --target ${{ matrix.target }} --no-default-features
          cargo check --package mqtt-async-embedded --target ${{ matrix.target }} --no-default-features

      - name: no_std + defmt logging
        run: |
          cargo check --package mqtt-packet --target ${{ matrix.target }} --no-default-features --features defmt
          cargo check --package mqtt-embedded --target ${{ matrix.target }} --no-default-features --features defmt
          cargo check --package mqtt-async-embedded --target ${{ matrix.target }} --no-default-features --features defmt
