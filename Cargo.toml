[package]
name = "mqtt-async-embedded"
version = "0.1.0"
edition = "2021"
authors = ["Faez Barghasa <faez.barghasa.org@gmail.com.com>"]
description = "An async, no_std-compatible MQTT client for embedded systems using Embassy."
license = "MIT OR Apache-2.0"
repository = "https://github.com/your-username/mqtt-async-embedded"
readme = "README.md"
keywords = ["mqtt", "async", "embedded", "embassy", "no_std"]
categories = ["embedded", "network", "asynchronous"]

[dependencies]
# Core embedded dependencies
embedded-hal = "1.0.0"
embedded-hal-async = "1.0.0"
heapless = "0.8"

# Async ecosystem
embassy-time = "*" # Use a more recent version if available
embassy-net = { version = "0.7.1", optional = true }
embassy-futures = "0.1.0"

# Utilities
async-trait = "0.1.80"
futures = { version = "0.3.30", default-features = false, features = ["async-await"] }

# Logging (optional)
defmt = { version = "0.3.8", optional = true }

# Packet parsing (optional)
nom = { version = "7.1.3", default-features = false, optional = true }

[features]
default = ["v3_1_1"]

# Selects MQTT protocol version
v3_1_1 = []
v5 = []

# Enables std support for testing on host machine
std = ["embassy-net", "embassy-net/std", "embassy-time/std"]

# Enables defmt logging
log-defmt = ["defmt"]

# Enables nom-based packet parsing
parser-nom = ["nom"]
embassy-net = ["dep:embassy-net"]

# Enables smoltcp integration
transport-smoltcp = ["embassy-net"]


[[example]]
name = "desktop_mock"
path = "examples/desktop_mock.rs"
required-features = ["std"]

[[example]]
name = "esp8266_uart"
path = "examples/esp8266_uart.rs"
# This example would require a specific HAL and setup, so it's a template.
# required-features = ["some-esp-hal"]

[[example]]
name = "smoltcp_ethernet"
path = "examples/smoltcp_ethernet.rs"
required-features = ["transport-smoltcp"]
